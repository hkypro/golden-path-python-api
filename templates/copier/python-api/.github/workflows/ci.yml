name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.21"
          python-version: "3.13"
          enable-cache: true
      - name: Require and install the locked environment
        run: test -f uv.lock && uv sync --locked
      - name: Lint, format, type-check, and test
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy src tests
          uv run --locked pytest
      - name: Build and smoke-test the image
        run: |
          docker build --tag generated-api:ci .
          docker run --detach --rm --name generated-api-smoke --publish 127.0.0.1:8000:8000 generated-api:ci
          trap 'docker rm --force generated-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs generated-api-smoke
          exit 1
