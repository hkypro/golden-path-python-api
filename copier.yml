_min_copier_version: "9.19.1"
_subdirectory: templates/copier/python-api
_answers_file: .copier-answers.yml
_message_after_copy: |
  Project created in {{ _copier_conf.dst_path }}.
  Next steps:
    cd {{ _copier_conf.dst_path }}
    uv sync
    uv run --locked pytest

project_slug:
  type: str
  help: Lowercase repository name (for example, catalog-api)
  default: demo-api
  validator: >-
    {%- set allowed = "abcdefghijklmnopqrstuvwxyz0123456789-" -%}
    {%- if project_slug | length < 1 or project_slug | length > 63 -%}
    project_slug must contain between 1 and 63 characters.
    {%- elif not project_slug[0].isalpha() or project_slug[0] != project_slug[0] | lower -%}
    project_slug must start with a lowercase ASCII letter.
    {%- elif project_slug.endswith('-') or '--' in project_slug -%}
    project_slug must contain non-empty segments separated by single hyphens.
    {%- else -%}
      {%- for character in project_slug -%}
        {%- if character not in allowed -%}
    project_slug may contain only lowercase ASCII letters, digits, and hyphens.
        {%- endif -%}
      {%- endfor -%}
      {%- if project_slug | replace('-', '_') in ['fastapi', 'uvicorn', 'pydantic', 'pytest', 'typing', 'logging', 'json', 'con', 'prn', 'aux', 'nul', 'com1', 'com2', 'com3', 'com4', 'com5', 'com6', 'com7', 'com8', 'com9', 'lpt1', 'lpt2', 'lpt3', 'lpt4', 'lpt5', 'lpt6', 'lpt7', 'lpt8', 'lpt9'] -%}
    project_slug produces a reserved Python package or Windows path name.
      {%- endif -%}
    {%- endif -%}

package_name:
  type: str
  default: "{{ project_slug | replace('-', '_') }}"
  when: false

project_description:
  type: str
  default: A small Python API
  validator: >-
    {%- if project_description | length < 1 or project_description | length > 180 -%}
    project_description must contain between 1 and 180 characters.
    {%- elif '\n' in project_description or '\r' in project_description -%}
    project_description must fit on one line.
    {%- endif -%}

author_name:
  type: str
  default: Project contributors
  validator: >-
    {%- if author_name | length < 1 or author_name | length > 100 -%}
    author_name must contain between 1 and 100 characters.
    {%- elif '\n' in author_name or '\r' in author_name -%}
    author_name must fit on one line.
    {%- endif -%}
