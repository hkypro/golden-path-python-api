[project]
name = "golden-path-python-api"
version = "0.1.0"
description = "Test harness for two maintainable Python API project templates"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "cookiecutter==2.7.1",
  "copier==9.19.1",
  "cruft==2.16.0",
  "pytest>=9.0,<10",
  "pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: generates and bootstraps isolated consumer projects",
  "lifecycle: exercises template updates in temporary Git repositories",
  "docker: builds and starts generated container images",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["tests"]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "ruff>=0.14,<1",
  "types-pyyaml>=6.0,<7",
]
